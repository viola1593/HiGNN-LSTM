experiment:
  experiment_name: "new_std" # OCtest10_simple_sharedfilm_withoutputterlayernorm_cntd" #seq2seq_gat_attention8" #gat_full_longerteacher" # gnn3_rnn2_oceantoall_longerteacher_biggermodel" 
  exp_dir: "experiments/heteromodel/era5grid" # gat/sharedgat" # "experiments/heteromodel/neighbours" # "experiments/heteromodel/perpixelnorm" # "experiments/heteromodel/neighbours"
wandb:
  project: twsa_heterograph_paramtune
  mode: online


model:
 forecasting_method: autoregressive # autoregressive or seq2seq
 learning_rate: 0.0005
 hidden_dim: 64 #64 # must be divisible by number of heads in GAT
#  num_heads: 4 # number of attention heads in GAT
 gnn_method: simple
 num_processing_gnns: 2 # 3 # for gnn_method simple, how many gnn layers are used in processing step
 gnn_embedding_dim: 4 # dimension of output from GNN
 rnn_hidden_size: 32 #128 
 rnn_layers: 2 # 1
 rnn_dropout: 0.4 # only for more than 1 rnn layer
 seq_emb_length: null #4 # null means no temporal convolution of feature sequences
 timestep_embed_dim: 2 # 
 frac_teacher_forcing_epochs: 0 # fraction of epochs to use teacher forcing
 plot_intermediate: 50

 


datamodule:
 ds_path: data/latest_data0326/TWSA-REC_era5_detrend_latavg.nc # data/twsa_rec_era5_global_1deg_detrend.nc
 train_val_test_split: [0.7, 0.2, 0.1]
 input_seq_len: 12 # Number of time steps in input sequence
 delay: 0 # Number of time steps between last observation in input sequence and target
 output_seq_len: 6
 batch_size: 4
 num_workers: 8
 graph_path: graphs/heterograph_ocean/detrended_era5grid   # fewerhydrobasins_pixelnorm
 num_ocean_clusters: 20
 k_mesh2mesh: 10 # 0: fully connected graph, every node is connected to every other node
 k_mesh2grid: 3
 input_vars: 
  - twsa
  - sst # sea surface temperature
  - sp # surface pressure
  - t2m # 2m temperature
  - si10 # 10 m wind speed
  - tp # total precipitation
  # - swvl1
  # - swvl2
  # - swvl3
  # - swvl4 #  soil moisture level 1-4 ----> they are weird
  # - lai_lv # leaf area index low vegetation
  # - lai_hv # leaf area index high vegetation
  # - lsm # land sea mask
  - e # evaporation
  - ro # runoff
  - pev # potential evaporation
  # - z # geopotential

pl: # all flags to pytorch lightning trainer
  devices: [4]
  accelerator: gpu
  max_epochs: 100
  max_steps: -1
  check_val_every_n_epoch: 1
  deterministic: True
  detect_anomaly: False
  fast_dev_run: False
  log_every_n_steps: 10
  overfit_batches: 0
  precision: bf16-mixed
  accumulate_grad_batches: 4 # effective batch size = batch_size * accumulate_grad_batches
  # gradient_clip_val: 1.0
  # gradient_clip_algorithm: norm
 
load_checkpoint: null # experiments/heteromodel/oceannodes/ OCtest10_simple_sharedfilm_withoutputterlayernorm_10-08-2025_16:01:16/twsa_heterograph_paramtune/0dw17qcq/checkpoints/epoch=99-step=900.ckpt
debug: False # no logging