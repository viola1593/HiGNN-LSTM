experiment:
  experiment_name: "trigmonthsextra_withgnnreadouts_freshx"
  exp_dir: "experiments/myModel/newdata" 
wandb:
  project: twsa_fullres 
  mode: online

modeltype: myModel
model:
 #num_nodes: 2592 # 36*72 nodes in the grid graph
#  num_input_features: 19 # 16 features+TWSA+month encoding
 num_months_per_gnn: 1
#  sequence_length: 12 #inferred from datamodule
#  num_hidden_features: 128
#  output_dim: 1
#  output_seq_len: 2 #inferred from datamodule
#  node_embedding_size: 12
#  gcn_layers: 4
#  rnn_layers: 4
 learning_rate: 0.01
 learn_adj: False # relevant only for GRUGCModule 
 #predefined_adj: False


 


datamodule:
 ds_path: data/twsa_rec_era5_global_1deg_detrend.nc
 input_seq_len: 12 # Number of time steps in input sequence
 delay: 0 # Number of time steps between last observation in input sequence and target
 output_seq_len: 2
 num_neighbours: 6 # number of neighbours to consider in the graph
 debug: False
 batch_size: 8
 num_workers: 4
 

 



pl: # all flags to pytorch lightning trainer
  devices: [0]
  accelerator: gpu
  max_epochs: 20
  max_steps: -1
  check_val_every_n_epoch: 1
  deterministic: True
  detect_anomaly: False
  fast_dev_run: False
  log_every_n_steps: 1
  overfit_batches: 0
  precision: bf16-mixed
 
load_checkpoint: null #experiments/myModel/newdata/overfit/new_nomalization_03-18-2025_13:32:01/twsa_fullres/zh1tt4rn/checkpoints/epoch=999-step=1000.ckpt
debug: False #True # no logging