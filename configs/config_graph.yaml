experiment:
  experiment_name: "graph12month_K4"
  exp_dir: "experiments/testgraph" 
wandb:
  project: twsa 
  mode: online

model:
 num_nodes: 2592 # 36*72 nodes in the grid graph
 in_channels: 16 # 16 feauters+4 from positional encoding
 hidden_channels: 64
 out_channels: 1
 K: 4 # chebconv_filter_size 
 # kernel_size: 3 given by sequence length
 output_seq_len: 1
 learning_rate: 0.001

 


datamodule:
 ds_path: data/twsa_rec_era5_global.nc
 local_lag: 12 # Number of time steps in input sequence
 delay: 12 # Number of time steps between last observation in input sequence and target
 debug: False
 batch_size: 32
 num_workers: 8
 aoi_longitude: null
  # - -15 
  # - 0
 aoi_latitude: null
  # - 35
  # - 25



pl: # all flags to pytorch lightning trainer
  devices: [2]
  accelerator: gpu
  max_epochs: 50
  max_steps: -1
  check_val_every_n_epoch: 1
  deterministic: True
  detect_anomaly: False
  fast_dev_run: False
  log_every_n_steps: 1
  overfit_batches: 0 
 
load_checkpoint: null #experiments/test/baseline_test_horizon12_50epochs_12-13-2024_18:03:48/twsa/sbmgbwmz/checkpoints/epoch=15-step=22128.ckpt

