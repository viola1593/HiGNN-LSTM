experiment:
  experiment_name: "repeatlasttimestep"
  exp_dir: "experiments/baseline_repeatlastTS" 
wandb:
  project: twsa 
  mode: online

model:
 learning_rate: 0.001


 


datamodule:
 ds_path: data/twsa_rec_era5_global.nc
 local_lag: 12 # Number of time steps in input sequence
 delay: 12 # Number of time steps between last observation in input sequence and target
 debug: False
 batch_size: 16
 num_workers: 8
 aoi_longitude: null
  # - -15 
  # - 0
 aoi_latitude: null
  # - 35
  # - 25



pl: # all flags to pytorch lightning trainer
  devices: [1]
  accelerator: gpu
  max_epochs: 1
  max_steps: -1
  check_val_every_n_epoch: 1
  deterministic: True
  detect_anomaly: False
  fast_dev_run: False
  log_every_n_steps: 1
  overfit_batches: 0 
 
load_checkpoint: null #experiments/test/baseline_test_horizon12_50epochs_12-13-2024_18:03:48/twsa/sbmgbwmz/checkpoints/epoch=15-step=22128.ckpt

